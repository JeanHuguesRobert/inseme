resume_public: >
  Le 8 août 2026, réponse adressée à la mairie de La Gaude à la suite de son courrier
  OLD-2026/010 concernant la parcelle AT0045. Après transmission du dossier au service
  compétent, la Police municipale a pris contact le 11 août pour proposer un rendez-vous et
  demander des coordonnées téléphoniques. Le propriétaire, actuellement en Corse, a répondu
  le même jour par courriel en demandant que les échanges restent écrits et que soient précisés
  les points à examiner ainsi que la nature du rendez-vous envisagé. Réponse de la Police
  municipale attendue.

