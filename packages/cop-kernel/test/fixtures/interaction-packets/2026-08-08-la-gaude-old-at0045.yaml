contexte: >
  La mairie a adressé un courrier relatif aux obligations légales de débroussaillement
  applicables à la propriété AT0045, en mentionnant plusieurs zonages PLUm (Nb, UFb3)
  et PPRIF (B1a, Rouge). Le site présente une configuration particulière, notamment
  une piste historiquement identifiée comme « piste incendie » immédiatement en contrebas,
  déjà signalée par écrit au cabinet du maire en 2017. Le projet de long terme pour le lieu
  est une station expérimentale de la Mariani School of Autonomy, articulant art, paysage,
  écologie, autonomie matérielle et résilience méditerranéenne. Ces éléments de projet ne
  sont pas mobilisés dans le premier courriel comme arguments de confrontation : la réponse
  privilégie une demande coopérative de détermination précise des obligations et modalités.
  Le 11 août, la Police municipale a pris directement contact et demandé les coordonnées
  téléphoniques du propriétaire afin de convenir d'un rendez-vous. Jean Hugues Robert étant
  actuellement en Corse et sans date prévisible de présence à La Gaude, il a répondu par
  écrit en demandant que les échanges restent tracés par courriel et que la Police précise
  d'abord par écrit les points à examiner ainsi que la nature du rendez-vous envisagé.

objet_de_l_acte: >
  Accuser réception du courrier municipal, confirmer la volonté de satisfaire aux prescriptions
  applicables, demander une cartographie et une détermination précises des modalités selon les
  différentes parties du terrain, solliciter un interlocuteur technique et proposer, si utile,
  une visite sur place avant travaux irréversibles. Demander en outre que le courriel devienne
  le mode de correspondance privilégié. À la suite du contact de la Police municipale, maintenir
  les échanges préparatoires par écrit, signaler l'éloignement géographique actuel et obtenir
  une formulation écrite de l'objet et des modalités du rendez-vous avant toute organisation.

