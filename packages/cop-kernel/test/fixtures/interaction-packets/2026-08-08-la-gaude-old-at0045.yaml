current_status:
  label: "Contact Police municipale reçu — réponse écrite envoyée ; précisions attendues"
  interpretation: >
    L'accusé de réception municipal est acquis et la Police municipale est désormais
    l'interlocuteur opérationnel. Sa prise de contact rapide est un signal à surveiller mais
    ne permet pas, à elle seule, de conclure à une procédure contentieuse ou coercitive.
    L'existence générale de l'obligation n'est pas contestée ; aucune non-conformité
    individualisée n'est reconnue. La stratégie immédiate consiste à conserver une trace
    écrite, obtenir la formulation précise des points à examiner et ne préjuger ni de la
    nécessité d'une visite ni de la présence personnelle du propriétaire. Celui-ci réside
    actuellement en Corse et ne dispose pas à ce stade d'une date prévisible de présence à
    La Gaude.

