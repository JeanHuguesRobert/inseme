name: FBF Magistral receipt regression
on:
  push:
    paths:
      - 'apps/platform/mcp/cop/magistralCapabilityResolver.js'
      - 'apps/platform/mcp/test/magistralCapabilityResolver.test.js'
      - '.github/workflows/fbf-magistral-receipts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and test under a non-failing result supervisor
        shell: bash
        run: |
          set +e
          npm ci --ignore-scripts > /tmp/fbf-install.log 2>&1
          install_rc=$?
          if [ "$install_rc" -eq 0 ]; then
            node --test apps/platform/mcp/test/magistralCapabilityResolver.test.js > /tmp/fbf-magistral.log 2>&1
            rc=$?
            phase=test
          else
            cp /tmp/fbf-install.log /tmp/fbf-magistral.log
            rc=$install_rc
            phase=install
          fi
          cat /tmp/fbf-magistral.log
          mkdir -p fbf-evidence
          cp /tmp/fbf-magistral.log fbf-evidence/test.log
          printf '{"schema":"fbf.test-result/v1","phase":"%s","exit_code":%s,"passed":%s}\n' "$phase" "$rc" "$([ "$rc" -eq 0 ] && echo true || echo false)" > fbf-evidence/result.json
          exit 0
      - name: Upload result independently of workflow outcome
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: fbf-magistral-receipts
          path: fbf-evidence/
          if-no-files-found: warn
          retention-days: 14
