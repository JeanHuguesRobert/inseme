name: FBF Magistral receipt regression
on:
  push:
    paths:
      - 'apps/platform/mcp/cop/magistralCapabilityResolver.js'
      - 'apps/platform/mcp/test/magistralCapabilityResolver.test.js'
      - '.github/workflows/fbf-magistral-receipts.yml'
      - 'scripts/ops/supervise-result*.js'
      - 'scripts/github-compute-finalize*.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install and test with shared non-failing supervisor
        shell: bash
        run: |
          set +e
          node scripts/ops/supervise-result.js --out fbf-install --phase install -- corepack pnpm install --frozen-lockfile --ignore-scripts
          if node -e 'const r=require("./fbf-install/result.json");process.exit(r.passed?0:1)'; then
            node scripts/ops/supervise-result.js --out fbf-build --phase build -- corepack pnpm --filter @inseme/cop-core run build
            if node -e 'const r=require("./fbf-build/result.json");process.exit(r.passed?0:1)'; then
              node scripts/ops/supervise-result.js --out fbf-evidence --phase test -- node --test apps/platform/mcp/test/magistralCapabilityResolver.test.js scripts/github-compute-finalize.test.js scripts/ops/supervise-result.test.js
            else
              mkdir -p fbf-evidence
              cp fbf-build/result.json fbf-evidence/result.json
              cp fbf-build/test.log fbf-evidence/test.log
            fi
          else
            mkdir -p fbf-evidence
            cp fbf-install/result.json fbf-evidence/result.json
            cp fbf-install/test.log fbf-evidence/test.log
          fi
          cat fbf-evidence/test.log
          exit 0
      - name: Upload result independently of workflow outcome
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: fbf-magistral-receipts
          path: fbf-evidence/
          if-no-files-found: warn
          retention-days: 14
