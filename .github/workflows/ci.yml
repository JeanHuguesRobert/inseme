name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test (Strict Accounting Enforcement)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build COP Core
        run: pnpm --filter @inseme/cop-core run build

      - name: Syntax Check Magistral
        run: pnpm --filter @inseme/magistral run check

      - name: Lint Accounting Packages
        run: pnpm run lint:accounting

      - name: Strict Accounting Adversarial Suite (Issue #45)
        run: pnpm run test:accounting

      - name: Run Test Suites (cop-core, cop-kernel, magistral)
        run: pnpm run test

      - name: C1 COP no-route Reality Test
        run: node --test apps/platform/mcp/test/magistralCapabilityResolver.test.js

      - name: C2 and C3 COP route persistence and cold-retry Reality Tests
        run: node --test apps/platform/mcp/test/cop-routing-decision-persistence.test.js

      - name: C4 producer and consumer subprocess smoke test
        run: |
          node apps/platform/mcp/c4-producer.mjs c4-artifact
          node apps/platform/mcp/c4-consumer.mjs c4-artifact

      - name: Watch the Watchers invariants (Issue #120)
        run: >-
          node --test
          scripts/watch-the-watchers.test.js
          scripts/watch-the-watchers-http.test.js
          apps/platform/mcp/test/artifactAccessSupabaseStore.test.js
          apps/platform/mcp/test/artifactAccessRouter.test.js
