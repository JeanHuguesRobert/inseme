name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test (Strict Accounting Enforcement)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build COP Core
        run: pnpm --filter @inseme/cop-core run build

      - name: Syntax Check Magistral
        run: pnpm --filter @inseme/magistral run check

      - name: Lint Accounting Packages
        run: pnpm run lint:accounting

      - name: Strict Accounting Adversarial Suite (Issue #45)
        run: pnpm run test:accounting

      - name: Run Test Suites (cop-core, cop-kernel, magistral)
        run: pnpm run test

      - name: C1 COP no-route Reality Test
        run: node --test apps/platform/mcp/test/magistralCapabilityResolver.test.js

      - name: C2 and C3 COP route persistence and cold-retry Reality Tests
        run: node --test apps/platform/mcp/test/cop-routing-decision-persistence.test.js

      - name: C4 double-check — successful handoff and exception as output
        run: |
          node apps/platform/mcp/c4-supervisor.mjs produce c4-artifact
          node apps/platform/mcp/c4-supervisor.mjs consume c4-artifact
          node -e "const fs=require('fs'); const a=JSON.parse(fs.readFileSync('c4-artifact/outcome.json')); const b=JSON.parse(fs.readFileSync('c4-artifact/consumer-outcome.json')); if(a.status!=='completed'||b.status!=='completed'||a.phase!=='produce'||b.phase!=='consume')process.exit(1);"
          C4_INJECT_ERROR=1 node apps/platform/mcp/c4-supervisor.mjs produce c4-error-artifact
          node -e "const fs=require('fs'); const a=JSON.parse(fs.readFileSync('c4-error-artifact/outcome.json')); if(a.status!=='error'||a.errors.length===0||a.errors[0].code!=='EXCEPTION')process.exit(1);"
          node apps/platform/mcp/c4-supervisor.mjs consume c4-missing-source
          node -e "const fs=require('fs'); const a=JSON.parse(fs.readFileSync('c4-missing-source/consumer-outcome.json')); if(a.status!=='error'||a.errors.length===0)process.exit(1);"
          C4_PROVENANCE_OK=failure node apps/platform/mcp/c4-supervisor.mjs consume c4-invalid-provenance
          node -e "const fs=require('fs'); const a=JSON.parse(fs.readFileSync('c4-invalid-provenance/consumer-outcome.json')); if(a.status!=='error'||!a.errors.some(e=>e.message.includes('provenance')))process.exit(1);"

      - name: C5 duplicate effect fencing Reality Test
        run: node --test apps/platform/mcp/test/cop-c5-duplicate-effect.test.js

      - name: Watch the Watchers invariants (Issue #120)
        run: >-
          node --test
          scripts/watch-the-watchers.test.js
          scripts/watch-the-watchers-http.test.js
          apps/platform/mcp/test/artifactAccessSupabaseStore.test.js
          apps/platform/mcp/test/artifactAccessRouter.test.js
