name: COP C4 Producer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        continue-on-error: true
      - name: Record no-route decision
        if: always()
        run: node apps/platform/mcp/c4-supervisor.mjs produce c4-artifact
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cop-c4-handoff
          path: c4-artifact/
          if-no-files-found: warn
          retention-days: 7
