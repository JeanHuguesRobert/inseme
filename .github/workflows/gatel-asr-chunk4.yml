name: Senate Gatel Missing ASR Chunk
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gatel-asr-chunk4.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chunk4:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Retry missing segment range
        continue-on-error: true
        env:
          CHUNK_INDEX: '4'
          OUTPUT_DIR: gatel-output
        run: node scripts/gatel-asr-chunk.js
      - name: Preserve status and text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatel-asr-chunk-4-${{ github.run_id }}
          path: gatel-output/*
          if-no-files-found: warn
          retention-days: 30
