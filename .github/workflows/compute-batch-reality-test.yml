# Reality Test trigger v2
name: Compute Batch Reality Test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/compute-batch-reality-test.yml"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/compute-batch-trigger"
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  compute-batch:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 85 &&
       contains(github.event.comment.body, '/compute-batch inseme-85-v1'))
    name: compute.batch / Magistral receipt Reality Test
    runs-on: ubuntu-latest
    env:
      REQUIREMENT_REF: requirement:compute-batch:inseme-85:v1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build COP Core
        run: pnpm --filter @inseme/cop-core run build

      - name: Validate generic compute seam
        id: validate
        continue-on-error: true
        run: |
          pnpm --filter @inseme/magistral run check
          pnpm --filter @inseme/magistral test
          node --test apps/platform/mcp/test/magistralCapabilityResolver.test.js
          node --test scripts/github-compute-request.test.js

      - name: Publish durable execution callback
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          if [ "$VALIDATION_OUTCOME" = "success" ]; then
            RECEIPT_STATUS="completed"
          else
            RECEIPT_STATUS="failed"
          fi

          RUN_URL="$SERVER_URL/$REPOSITORY/actions/runs/$RUN_ID"

          BODY=$(printf '%s\n' \
            '## compute.batch callback' \
            '' \
            '```yaml' \
            'execution_binding:' \
            '  schema: magistral.execution-binding/v1' \
            "  requirement_ref: \"$REQUIREMENT_REF\"" \
            '  provider_ref: "provider:github-actions"' \
            "  provider_execution_id: \"$RUN_ID\"" \
            '  execution_surface: "batch"' \
            '  runtime_id: "runtime:github-actions:ubuntu-latest"' \
            "  handler_instance_ref: \"handler:github-actions:$RUN_ID\"" \
            '' \
            'execution_receipt:' \
            '  schema: magistral.execution-receipt/v1' \
            "  status: \"$RECEIPT_STATUS\"" \
            '  terminal: true' \
            '  result_refs:' \
            "    - \"git:$SHA\"" \
            '  log_refs:' \
            "    - \"github-actions-run:$RUN_ID\"" \
            '  error: null' \
            '```' \
            '' \
            "Provider execution: $RUN_URL" \
            "Run attempt: $RUN_ATTEMPT")

          gh api "repos/$REPOSITORY/issues/85/comments" -f body="$BODY"

      # Validation failure is a compute result recorded above, not a runner crash.


  typed-compute-request:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.comment.user.login == github.repository_owner &&
      contains(github.event.comment.body, '"schema": "cop.compute-request/v1"')
    name: typed compute request / bounded GitHub adapter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout trusted adapter from main
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Preserve trusted failure finalizer
        if: always()
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/compute-supervisor"
          cp scripts/github-compute-finalize.js scripts/github-compute-failure.js "$RUNNER_TEMP/compute-supervisor/"
          printf '{"type":"module"}\n' > "$RUNNER_TEMP/compute-supervisor/package.json"

      - name: Parse and validate typed request
        continue-on-error: true
        id: request
        run: |
          node scripts/github-compute-request.js parse-event \
            --event "$GITHUB_EVENT_PATH" \
            --github-output "$GITHUB_OUTPUT" \
            --request-file "$RUNNER_TEMP/compute-request.json"

      - name: Check idempotent durable result
        continue-on-error: true
        id: replay
        if: steps.request.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.request.outputs.issue }}
          COMPUTATION_ID: ${{ steps.request.outputs.computation_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" --paginate --jq '.[].body' > "$RUNNER_TEMP/issue-comments.txt"
          if grep -Fq -- "<!-- cop-compute-result:$COMPUTATION_ID -->" "$RUNNER_TEMP/issue-comments.txt"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Preserve trusted resource adapter across source checkout
        continue-on-error: true
        if: steps.replay.outcome == 'success' && steps.replay.outputs.skip != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/compute-adapter"
          cp scripts/github-compute-resource-cli.js scripts/github-compute-resources.js scripts/github-compute-failure.js "$RUNNER_TEMP/compute-adapter/"
          printf '{"type":"module"}\n' > "$RUNNER_TEMP/compute-adapter/package.json"

      - name: Snapshot provider quota and decide resource admission
        continue-on-error: true
        id: admission
        if: steps.replay.outcome == 'success' && steps.replay.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TIMEOUT_SECONDS: ${{ steps.request.outputs.timeout_seconds }}
        run: |
          node "$RUNNER_TEMP/compute-adapter/github-compute-resource-cli.js" before \
            "$RUNNER_TEMP/compute-resource-before.json" \
            "$RUNNER_TEMP/compute-admission.json" \
            "$GITHUB_OUTPUT" "$TIMEOUT_SECONDS"

      - name: Return non-admission as structured result
        continue-on-error: true
        if: steps.replay.outcome == 'success' && steps.replay.outputs.skip != 'true' && steps.admission.outputs.admission != 'admitted'
        run: |
          node "$RUNNER_TEMP/compute-adapter/github-compute-resource-cli.js" refuse \
            "$RUNNER_TEMP/compute-request.json" \
            "$RUNNER_TEMP/compute-result.json" \
            "$RUNNER_TEMP/compute-admission.json"

      - name: Checkout exact requested source commit
        continue-on-error: true
        if: steps.replay.outcome == 'success' && steps.replay.outputs.skip != 'true' && steps.admission.outputs.admission == 'admitted'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.ref }}
          persist-credentials: false

      - name: Verify exact source commit
        id: verify
        continue-on-error: true
        if: steps.replay.outcome == 'success' && steps.replay.outputs.skip != 'true' && steps.admission.outputs.admission == 'admitted'
        env:
          EXPECTED_REF: ${{ steps.request.outputs.ref }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_REF"

      - name: Execute allowlisted computation
        continue-on-error: true
        id: execute
        if: steps.verify.outcome == 'success' && steps.admission.outputs.admission == 'admitted'
        env:
          TIMEOUT_SECONDS: ${{ steps.request.outputs.timeout_seconds }}
        run: |
          timeout "$TIMEOUT_SECONDS"s node scripts/github-compute-request.js execute \
            --request-file "$RUNNER_TEMP/compute-request.json" \
            --result-file "$RUNNER_TEMP/compute-result.json"

      - name: Recover interrupted compute into a failed receipt
        continue-on-error: true
        if: steps.replay.outcome == 'success' && steps.replay.outputs.skip != 'true' && steps.admission.outputs.admission == 'admitted' && steps.execute.outcome != 'success'
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node "$RUNNER_TEMP/compute-adapter/github-compute-failure.js" \
            "$RUNNER_TEMP/compute-request.json" \
            "$RUNNER_TEMP/compute-result.json" \
            "$RUN_ID" "$RUN_URL" "compute_execution_interrupted"

      - name: Upload generic program outputs
        continue-on-error: true
        if: steps.replay.outcome == 'success' && steps.replay.outputs.skip != 'true' && steps.admission.outputs.admission == 'admitted' && steps.request.outputs.operation_kind == 'git-program'
        uses: actions/upload-artifact@v4
        with:
          name: compute-${{ steps.request.outputs.computation_id }}
          path: ${{ runner.temp }}/compute-artifacts/*
          if-no-files-found: warn
          retention-days: 14

      - name: Attach before/after resource accounting
        continue-on-error: true
        if: steps.replay.outcome == 'success' && steps.replay.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node "$RUNNER_TEMP/compute-adapter/github-compute-resource-cli.js" after \
            "$RUNNER_TEMP/compute-resource-before.json" \
            "$RUNNER_TEMP/compute-admission.json" \
            "$RUNNER_TEMP/compute-result.json"

      - name: Render structured result
        continue-on-error: true
        if: steps.replay.outcome == 'success' && steps.replay.outputs.skip != 'true'
        run: |
          node scripts/github-compute-request.js format-result \
            --result-file "$RUNNER_TEMP/compute-result.json" \
            --comment-file "$RUNNER_TEMP/compute-result.md"

      - name: Publish durable structured result
        continue-on-error: true
        if: steps.replay.outcome == 'success' && steps.replay.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.request.outputs.issue }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" \
            -f body="$(cat "$RUNNER_TEMP/compute-result.md")"

      # A returned failed ExecutionReceipt is an expected computation outcome.
      # Only infrastructure/callback failures should fail this job.

      - name: Ensure one structured result callback even after exceptions
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f "$RUNNER_TEMP/compute-supervisor/github-compute-finalize.js" ]; then
            node "$RUNNER_TEMP/compute-supervisor/github-compute-finalize.js"
          else
            echo "Compute supervisor unavailable; inspect checkout failure" >> "$GITHUB_STEP_SUMMARY"
          fi
